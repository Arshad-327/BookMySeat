# api-gateway
#
# The single public entry point. Spring Cloud Gateway on WebFlux and Netty: reactive
# end to end. spring-boot-starter-web must never be added to this module, and nothing
# here may block - a blocked Netty event-loop thread stalls every request sharing it.
#
# Built: P4.1 routing, P4.2 JWT validation, P4.3 rate limiting.
#
# Two profiles, the same shape as every other service:
#   default  - on the host. Downstream services on localhost:8081-8083.
#   docker   - inside Compose. Downstream services by Compose service name.
# Each target is also overridable from the environment, so one build works anywhere.
#
# ---------------------------------------------------------------------------------
# WHAT DOES NOT CHANGE BECAUSE THE GATEWAY EXISTS
# ---------------------------------------------------------------------------------
# * Services stay directly reachable on 8081-8083. The gateway is an additional way in,
#   not a replacement. The load tests target booking-service on 8083, and the
#   before/after comparison runs are only comparable while that path is unchanged.
# * booking-service calls event-service directly (app.event-service.base-url), service
#   to service. That traffic never passes through here and must not start to: it is not
#   client traffic, and it uses /api/internal/**, which this gateway refuses to route.

server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      # Rate-limit counters, under ratelimit:token-bucket:*. The same Redis as seat:hold:*
      # and idem:*; reset-fixtures.sh leaves keys it does not own alone, so counters survive
      # a fixture reset.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short. This is on the path of every request. app.rate-limit.redis-timeout is the
      # binding limit on one check; these stop the client itself holding on longer.
      timeout: 250ms
      connect-timeout: 250ms

  cloud:
    # No service discovery (CLAUDE.md): routes point at fixed hosts from properties.
    # Spring Cloud Commons still registers a discovery health indicator by default,
    # which reports "Discovery Client not initialized" on /actuator/health and reads
    # as though discovery were half set up. Off, so the health page says what is true.
    discovery:
      enabled: false

    gateway:
      # -----------------------------------------------------------------------------
      # FILTER ORDER
      # -----------------------------------------------------------------------------
      #   1. rate limit      (P4.3, RateLimitFilter, order -200)
      #   2. JWT validation  (P4.2, JwtAuthenticationFilter, order -100)
      #   3. routing to the service
      #
      # Rate limiting comes FIRST, deliberately. A rate-limit check is one Redis
      # script call; verifying a JWT is an HMAC over the token. Abusive traffic
      # has to be turned away before the gateway spends CPU verifying signatures for
      # it. In the other order, a flood of junk tokens costs a signature check each and
      # becomes a cheap way to burn the gateway's CPU.
      # -----------------------------------------------------------------------------

      # -----------------------------------------------------------------------------
      # IDENTITY - see JwtAuthenticationFilter for the full policy
      # -----------------------------------------------------------------------------
      # Every inbound X-User-* header is stripped, in any letter case, on every request.
      # On protected paths the gateway then sets X-User-Id and X-User-Role from the
      # validated access token. Clients can no longer choose who they are through 8080.
      #
      # Public: /api/auth/**, and GET /api/events/**, GET /api/shows/*/seats and
      # GET /api/demo/**.
      # Protected: every other routed path - /api/bookings/** and /api/admin/** today.
      #
      # Direct calls to 8081-8083 are unchanged and still take X-User-Id on trust. The
      # load tests depend on that. Those ports belong on the internal network only.
      # -----------------------------------------------------------------------------

      routes:
        - id: auth-service
          uri: ${app.services.auth-service}
          predicates:
            - Path=/api/auth/**

        - id: event-service
          uri: ${app.services.event-service}
          predicates:
            - Path=/api/events/**,/api/shows/**,/api/admin/**

        - id: booking-service
          uri: ${app.services.booking-service}
          predicates:
            - Path=/api/bookings/**

        # GET /api/demo/spam - exists only to trigger a visible 429 in a live demo. It
        # answers 200 instantly and touches no service.
        #
        # DO NOT "SIMPLIFY" THIS INTO A @RestController IN THE GATEWAY. It is a route to
        # no://op on purpose. Global filters - RateLimitFilter, JwtAuthenticationFilter - run
        # only for requests a GATEWAY ROUTE matched. A local controller is served by
        # RequestMappingHandlerMapping, which outranks the gateway's RoutePredicateHandlerMapping,
        # so its requests never enter the filter chain at all. The demo endpoint would become
        # the one path in the system that is not rate limited - the opposite of its purpose.
        # no://op matches as a route, passes through every global filter, forwards nowhere,
        # and SetStatus supplies the 200.
        #
        # Deliberately NO Method=GET predicate. A CORS preflight arrives as OPTIONS, so a
        # GET-only route does not match it and the browser's preflight is refused with 403
        # before the real request is sent (found by RateLimitFilterTest). GET-only is enforced
        # where it already is for the catalogue: JwtAuthenticationFilter makes /api/demo/**
        # public for GET and HEAD only, so any other method gets 401.
        - id: rate-limit-demo
          uri: no://op
          predicates:
            - Path=/api/demo/spam
          filters:
            - SetStatus=200

      # -----------------------------------------------------------------------------
      # DELIBERATELY NOT ROUTED - a request for either of these gets 404 here
      # -----------------------------------------------------------------------------
      # There is no route for these paths, and none may ever be added. A path no route
      # matches is answered 404 by the gateway itself and never reaches a service.
      #
      #   /api/internal/**  Service-to-service only. event-service's
      #                     POST /api/internal/shows/{id}/seats/book has no
      #                     authentication of its own: it trusts that only
      #                     booking-service can reach it. A route here would let anyone
      #                     on the internet mark seats BOOKED. It stays reachable only on
      #                     the Docker network, by service name.
      #
      #   /actuator/**      Health details belong on the internal network. The services
      #                     run with show-details: always, which reports the state of
      #                     their database and Redis to whoever asks.
      #
           # This is also why the gateway's OWN actuator is on a separate management port
      # (below) and not on 8080: on 8080 it would answer /actuator/health with 200, and
      # the public port would serve actuator after all.
      #
      # The event-service side of this invariant is recorded in InternalSeatController's
      # class javadoc.
      # -----------------------------------------------------------------------------

      # One origin policy for the whole platform, enforced here and ONLY here. No
      # downstream service configures CORS. If one ever did, the browser would receive
      # two Access-Control-Allow-Origin headers and reject the response.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              # Vite dev server.
              - http://localhost:5173
              # The deployed frontend. example.com is reserved and can never be a real
              # site, so an unset value allows no real origin.
              - ${app.cors.production-origin}
            allowedMethods:
              - GET
              - POST
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Content-Type
              - Authorization
              - Idempotency-Key
              # X-User-Id is deliberately NOT allowed. The gateway sets it from the token,
              # and a browser has no business sending it - a preflight asking for it is
              # refused.
            exposedHeaders:
              # POST /api/bookings/hold answers 201 with Location.
              - Location
              # So the frontend can read how long to back off, and show the budget left.
              - Retry-After
              - X-RateLimit-Remaining
            # Tokens travel in the Authorization header, not in cookies.
            allowCredentials: false
            maxAge: 3600

      httpclient:
        # A dead service must fail fast rather than hold a connection open. The response
        # timeout sits above booking-service's own 5s read timeout on event-service, so
        # a slow confirm is reported by booking-service, not cut off here first.
        connect-timeout: 2000
        response-timeout: 10s

app:
  jwt:
    # MUST equal auth-service's app.jwt.secret: the gateway verifies what auth-service
    # signs. Same environment variable, same development default, so local runs work with
    # no setup and a deployment sets APP_JWT_SECRET once for both.
    secret: ${APP_JWT_SECRET:CHANGE_ME_DEV_ONLY_NOT_FOR_ANY_REAL_DEPLOYMENT}

  services:
    auth-service: ${AUTH_SERVICE_URL:http://localhost:8081}
    event-service: ${EVENT_SERVICE_URL:http://localhost:8082}
    booking-service: ${BOOKING_SERVICE_URL:http://localhost:8083}
  cors:
    production-origin: ${CORS_PRODUCTION_ORIGIN:https://bookmyseat.example.com}

  # Token-bucket rate limiting, per client IP, per route. See RateLimitFilter for the
  # reasoning; every number here is a property so it can be tuned without a rebuild.
  rate-limit:
    # The most one check waits on Redis before the request is let through (fail open).
    redis-timeout: 100ms
    # 0: clients reach the gateway directly, so the socket address is the client and
    # X-Forwarded-For is ignored. Set to the number of trusted proxies in front of it.
    trusted-proxy-hops: 0

    # Everything without a route policy. Burst 40: a page load firing several requests,
    # plus quick navigation, fits comfortably. Sustained 120/min (2 tokens/s): a seat map
    # polled every 3-4 seconds is 0.25-0.33 tokens/s, far inside it. First-minute ceiling
    # 40 + 120 = 160. Key TTL 60s (refills from empty in 20s).
    default-policy:
      name: default
      capacity: 40
      refill-per-minute: 120

    # First match wins.
    routes:
      # The demo endpoint. Burst 20, then one token every 3 seconds (20/min): the 21st
      # rapid request gets 429 with Retry-After 3. First-minute ceiling 20 + 20 = 40. Key
      # TTL 60s, exactly its refill-from-empty time, which is correct rather than marginal.
      - pattern: /api/demo/**
        policy:
          name: demo
          capacity: 20
          refill-per-minute: 20

management:
  health:
    redis:
      # The gateway's Redis is ADVISORY: rate limiting fails open without it. Reporting the
      # gateway DOWN when Redis is down would invite a load balancer to pull a gateway that
      # is deliberately still serving - turning a Redis outage into the total outage that
      # failing open exists to avoid.
      enabled: false
  # The gateway's own health, on a port of its own. Not on 8080, so the public port
  # serves no actuator at all (see DELIBERATELY NOT ROUTED above). Publish 8090 to the
  # internal network only, never through a public load balancer.
  server:
    port: ${MANAGEMENT_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

---
# Inside Compose: downstream services and Redis by service name, per CLAUDE.md.
spring:
  config:
    activate:
      on-profile: docker

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  services:
    auth-service: ${AUTH_SERVICE_URL:http://auth-service:8081}
    event-service: ${EVENT_SERVICE_URL:http://event-service:8082}
    booking-service: ${BOOKING_SERVICE_URL:http://booking-service:8083}

# A static server for a single-page app, and nothing more.
#
# It does NOT proxy /api to the gateway. The browser calls the gateway directly, as a
# cross-origin request - the same as in development - so CORS is exercised here too.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Client-side routes (/shows/1, /bookings/7) are not files. Without this fallback a
    # reload or a pasted link on any of them is a 404 from nginx before React ever runs.
    location / {
        try_files $uri /index.html;
    }

    # Vite puts a content hash in every asset's file name, so an asset never changes
    # under the same URL and can be cached for good. index.html must not be: it is what
    # points at the current hashes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

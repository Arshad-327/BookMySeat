# booking-service
#
# Two profiles, one datasource shape:
#   default  - running the jar / IDE on the host. MySQL is published on 13306
#              because two native MySQL instances already hold 3306 and 3307.
#   docker   - running inside Compose. Reaches MySQL and event-service by service
#              name, per CLAUDE.md (services find each other by Docker Compose
#              service name).
#
# Credentials come from the environment and fall back to local dev values.

server:
  port: 8083

spring:
  application:
    name: booking-service

  datasource:
    # connectionTimeZone=UTC  - the session zone the driver assumes; matches the
    #                           container's --default-time-zone=+00:00. Replaces
    #                           serverTimezone, which is a deprecated alias.
    # preserveInstants=true   - send/receive TIMESTAMP values as instants rather
    #                           than as wall-clock text. Already the driver default;
    #                           pinned so a future default change cannot shift data.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/${DB_NAME:booking_db}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&preserveInstants=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      # CLAUDE.md: always validate. Flyway owns every schema change.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      # Seat holds. Same two-profile shape as the datasource: on the host Redis is
      # published on 6379, inside Compose it is reached by service name.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short and explicit. This is on the request path, and the hold endpoint
      # fails closed - a hung Redis must surface as a fast 503 rather than hold
      # request threads open until the pool is exhausted.
      timeout: 2s
      connect-timeout: 2s

  task:
    scheduling:
      pool:
        # Two scheduled jobs share this scheduler: ExpiredBookingSweeper and OutboxPublisher.
        # Spring's default is ONE thread, on which a slow Kafka send would silently delay the
        # expiry sweep - and would look like a sweeper bug. Two, one per job.
        size: 2

  kafka:
    # The broker. booking.confirmed is the only topic (KafkaConfig), and only OutboxPublisher
    # sends to it. Nothing on the request path touches Kafka.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Every in-sync replica acknowledges before a send counts as done.
      acks: all
      properties:
        # Stops Kafka's OWN network retries of a single send from duplicating it. It does not
        # stop the outbox sending a row twice after a crash - that is at-least-once, handled
        # by idempotent consumers. See OutboxPublisher.
        enable.idempotence: true
        # Bounded, so a down broker costs the publisher seconds, not the client defaults of a
        # minute or more. delivery.timeout.ms must be at least linger.ms + request.timeout.ms.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    admin:
      # Kafka down at startup must not stop booking-service starting: bookings do not need
      # Kafka, the outbox holds events until it returns. The failure is logged.
      fail-fast: false
      operation-timeout: 5s

app:
  scheduling:
    # Turns @Scheduled jobs on: ExpiredBookingSweeper (every 60s) and OutboxPublisher (every
    # 2s). Both assume a single instance: set this false on every instance but one until they
    # have a distributed lock or row claiming. Tests set it false and run the jobs directly.
    enabled: true

  outbox:
    # The most events one publisher run sends. A backlog drains over several runs.
    batch-size: 100
    # The most one send waits for the broker's acknowledgement. Above
    # delivery.timeout.ms, so the producer gives its own verdict first.
    send-timeout: 15s

  seat-hold:
    # How long a PENDING booking owns its seats. Ten minutes per CLAUDE.md.
    # Written into both the Redis key TTL and bookings.expires_at, so the two
    # never disagree. Drop it to a few seconds to test expiry behaviour:
    #   java -jar ... --app.seat-hold.ttl=5s
    ttl: 600s

  idempotency:
    # How long a used Idempotency-Key is remembered in Redis. Unlike the seat-hold
    # TTL above, this one is housekeeping rather than semantics: when it lapses, a
    # replay falls through to the unique index on bookings.idempotency_key and still
    # gets the original booking back. Expiry costs a round trip, not correctness.
    ttl: 86400s

  event-service:
    # On the host this is localhost:8082; inside Compose it is the service name.
    # Overridable so the same jar works in both places without a rebuild.
    base-url: ${EVENT_SERVICE_URL:http://localhost:8082}
    # Short on purpose. event-service is called synchronously on the request path,
    # so a hung dependency must fail fast rather than pile up threads.
    connect-timeout: 2s
    read-timeout: 5s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

---
# Inside Compose: MySQL and event-service both reached by service name.
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:booking_db}?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&preserveInstants=true

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  kafka:
    # The broker's INTERNAL listener, for other containers (docker-compose.infra.yml).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

app:
  event-service:
    base-url: ${EVENT_SERVICE_URL:http://event-service:8082}

---
# Opt-in SQL tracing, same shape as event-service. Enable deliberately:
#   java -jar target/booking-service-0.0.1-SNAPSHOT.jar --spring.profiles.active=sql-debug
spring:
  config:
    activate:
      on-profile: sql-debug

  jpa:
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG
